# Daytona sandboxes only: containers reach outside hosts through the sandbox proxy.
# docker compose -f local-test/compose.yaml -f local-test/compose.proxy.yaml up -d
services:
  languagetool:
    environment:
      HTTPS_PROXY: ${HTTPS_PROXY}
      HTTP_PROXY: ${HTTP_PROXY}
      NO_PROXY: ${NO_PROXY:-}
      CURL_CA_BUNDLE: /ca.crt
    volumes: ["${NODE_EXTRA_CA_CERTS}:/ca.crt:ro"]
